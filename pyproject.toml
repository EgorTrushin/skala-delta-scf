[project]
name = "skala-delta-scf"
version = "0.1.0"
description = "Data analysis and reproduction of Skala delta-SCF benchmark figures and tables"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.26",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
]

# Run scripts from the repository root; no package build is needed.
[tool.uv]
package = false
